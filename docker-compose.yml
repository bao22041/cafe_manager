services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-}
      AIVEN_DB_URL: ${AIVEN_DB_URL:-}
      AIVEN_DB_HOST: ${AIVEN_DB_HOST:-}
      AIVEN_DB_PORT: ${AIVEN_DB_PORT:-10017}
      AIVEN_DB_USER: ${AIVEN_DB_USER:-avnadmin}
      AIVEN_DB_PASSWORD: ${AIVEN_DB_PASSWORD:-}
      AIVEN_DB_PASSWORD_FALLBACK: ${AIVEN_DB_PASSWORD_FALLBACK:-}
      AIVEN_DB_NAME: ${AIVEN_DB_NAME:-defaultdb}
      AIVEN_SSL_MODE: ${AIVEN_SSL_MODE:-REQUIRED}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-*}
    ports:
      - "5000:5000"
    networks:
      - cafe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
        VITE_SOCKET_URL: ""
    container_name: cafe-frontend
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "80:80"
    networks:
      - cafe-network

networks:
  cafe-network:
    driver: bridge